<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Navbar</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      border-bottom: 1px solid #ddd;
    }

    /* LEFT BOX */
    .left-box {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .left-box img {
      width: 90px;
    }

   
    .middle-box {
      display: flex;
      align-items: center;
      flex: 1;
      justify-content: center;
      gap: 10px;
    }

    .search-box {
      width: 90%;
      height: 40px;
      border: 1px solid gray;
      border-radius: 20px 0 0 20px;
      overflow:hidden;
      display: flex;
      align-items: center;
    }

    .search-box input {
      width: 70%;
      height: 70%;
      border: none;
      padding-left: 15px;
      outline: none;
      font-size: 15px;
    }

    .search-btn {
      height: 62px;
      width: 80px;
      border: 1px solid green;
      border-left: none;
      border-radius: 0 20px 20px 0;
      background: #f0f0f0;
      cursor: all-scroll;
    }

    .mic-btn {
      height: 30px;
      width: 30px;
      border-radius: 50%;
      border: none;
      margin-left: 10px;
      background: green;
    }

   
    .right-box {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .create-btn,
    .notification-btn :hover{
      background: #f0f0f0;
      border: none;
      height: 40px;
      width: 40px;
      border-radius: 50%;
      cursor: pointer;
    }

    .profile-picture {
      width: 35px;
      height: 35px;
      border-radius: 50%;
    }
    .notification-btn-bell:hover {
      background-color: aqua;
    } 
  </style>
</head>

<body>

  <nav>

   
    <div class="left-box">
      <i class="fa-solid fa-bars fa-lg"></i>
      <img src="assets/youtube-logo-png-46020.png"" alt="YouTube Logo">
    </div>

    
    <div class="middle-box">
      <div class="search-box">
        <input type="text" placeholder="Search">
      </div>
      <button class="search-btn">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
      <button class="mic-btn">
        <i class="fa-solid fa-microphone"></i>
      </button>
    </div>

    
    <div class="right-box">
      <button class="create-btn">
        <i class="fa-solid fa-plus"></i>
      </button>

      <button class="notification-btn">
        <i class="fa-regular fa-bell"></i>
      </button>

      <img
        class="profile-picture"
        src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=580&auto=format"
        alt="Profile">
    </div>

  </nav>

</body>
</html>
